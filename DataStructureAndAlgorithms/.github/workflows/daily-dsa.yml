name: Daily DSA Commit

on:
  # Run every day at 10:00 AM IST
  schedule:
    - cron: "30 4 * * *"

  # Allows manual testing from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create daily commit
        run: |
          echo "Daily DSA commit - $(date)" >> daily-dsa-log.txt
          git add daily-dsa-log.txt
          git commit -m "Daily DSA commit" || echo "Nothing to commit"
          git push